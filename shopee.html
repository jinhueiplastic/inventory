<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錦輝塑膠 - 蝦皮訂單管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        .blur-bg { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .tab-active { background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); color: #2563eb; font-weight: 700; }
        .order-card { transition: all 0.25s cubic-bezier(.4,0,.2,1); }
        .order-card:active { transform: scale(0.985); }
        .slide-in { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .checkbox-custom {
            width:20px; height:20px; border-radius:6px; border:2px solid #cbd5e1;
            background:white; display:flex; align-items:center; justify-content:center;
            flex-shrink:0; cursor:pointer; transition:all 0.15s;
        }
        .checkbox-custom.checked { background:#f97316; border-color:#f97316; }
        #img-lightbox { display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.88); z-index:9999;
            align-items:center; justify-content:center; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-32">

<!-- Loading 畫面 -->
<div id="loading-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#f8fafc;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
    <div style="width:48px;height:48px;border:4px solid #fed7aa;border-top-color:#f97316;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <div style="text-align:center;">
        <div style="font-size:14px;font-weight:700;color:#1e293b;font-family:sans-serif;">蝦皮訂單管理</div>
        <div id="loading-msg" style="font-size:12px;color:#94a3b8;margin-top:4px;font-family:sans-serif;">正在載入訂單與圖片...</div>
    </div>
    <div id="loading-timeout-msg" style="font-size:11px;color:#f97316;font-family:sans-serif;display:none;">載入時間較長，圖片數量較多請稍候</div>
</div>

<!-- 圖片放大 Lightbox -->
<div id="img-lightbox" onclick="closeLightbox()">
    <img id="img-lightbox-src" src="" style="max-width:90vw;max-height:85vh;object-fit:contain;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div onclick="closeLightbox()" style="position:absolute;top:16px;right:20px;color:white;font-size:32px;cursor:pointer;line-height:1;font-weight:300;">✕</div>
</div>

<header class="bg-white/80 blur-bg border-b border-slate-200/80 sticky top-0 z-50 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a href="./index.html" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-95 transition-all mr-1">
                <span class="material-icons text-xl">arrow_back</span>
            </a>
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white shadow-md shadow-orange-200">
                <span class="material-icons text-base">storefront</span>
            </div>
            <div>
                <h1 class="text-sm font-bold text-slate-900 tracking-wide">蝦皮訂單管理</h1>
                <p class="text-[10px] text-slate-500 font-medium tracking-wider uppercase">Shopee Orders</p>
            </div>
        </div>
        <button onclick="loadOrders()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-95 transition-all">
            <span class="material-icons text-xl">refresh</span>
        </button>
    </div>

    <div id="status-bar" class="bg-amber-50 border-t border-amber-100 text-[11px] text-amber-700 py-1 px-4 text-center font-medium flex items-center justify-center gap-1.5 transition-all">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="status-text">正在載入訂單資料...</span>
    </div>

    <div class="bg-slate-100/80 mx-4 my-2 rounded-xl p-1 flex gap-1">
        <button onclick="switchTab('picklist')" id="tab-picklist"
            class="tab-active flex-1 py-1.5 rounded-lg text-xs transition-all flex items-center justify-center gap-1">
            <span class="material-icons text-sm">list_alt</span><span>拿貨表</span>
        </button>
        <button onclick="switchTab('pending')" id="tab-pending"
            class="flex-1 py-1.5 rounded-lg text-xs text-slate-500 transition-all flex items-center justify-center gap-1">
            <span class="material-icons text-sm">local_shipping</span><span>未出貨</span>
            <span id="badge-pending" class="bg-red-500 text-white text-[10px] px-1.5 rounded-full leading-4 hidden">0</span>
        </button>
        <button onclick="switchTab('shipped')" id="tab-shipped"
            class="flex-1 py-1.5 rounded-lg text-xs text-slate-500 transition-all flex items-center justify-center gap-1">
            <span class="material-icons text-sm">check_circle</span><span>已出貨</span>
            <span id="badge-shipped" class="bg-emerald-500 text-white text-[10px] px-1.5 rounded-full leading-4 hidden">0</span>
        </button>
        <button onclick="switchTab('restock')" id="tab-restock"
            class="flex-1 py-1.5 rounded-lg text-xs text-slate-500 transition-all flex items-center justify-center gap-1">
            <span class="material-icons text-sm">inventory</span><span>補貨</span>
            <span id="badge-restock" class="bg-amber-500 text-white text-[10px] px-1.5 rounded-full leading-4 hidden">0</span>
        </button>
    </div>
</header>

<main class="max-w-md mx-auto px-4 mt-3">

    <!-- 拿貨表 -->
    <div id="page-picklist">
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-4">
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 px-4 py-3 flex items-center gap-2">
                <span class="material-icons text-white text-lg">inventory_2</span>
                <div>
                    <div class="text-white font-bold text-sm">拿貨清單</div>
                    <div class="text-orange-100 text-[10px]">統計所有未出貨訂單商品</div>
                </div>
                <div class="ml-auto text-right">
                    <div id="picklist-total" class="text-white font-bold text-lg">0</div>
                    <div class="text-orange-100 text-[10px]">種商品</div>
                </div>
            </div>
            <div id="picklist-body" class="divide-y divide-slate-100">
                <div class="text-center py-6 text-slate-400 text-xs">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 未出貨 -->
    <div id="page-pending" class="hidden">
        <div id="select-toolbar" class="bg-white rounded-xl border border-slate-200 p-3 mb-3 flex items-center justify-between hidden">
            <button onclick="toggleSelectAll()" class="flex items-center gap-2 text-sm text-slate-600 font-medium active:scale-95 transition-all">
                <div id="select-all-box" class="checkbox-custom">
                    <span class="material-icons text-white text-sm hidden" id="select-all-check">check</span>
                </div>
                <span>全選所有訂單</span>
            </button>
            <button onclick="shipSelected()" id="btn-ship-selected"
                class="bg-orange-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition-all opacity-40"
                disabled>
                <span class="material-icons text-sm">local_shipping</span>
                一鍵出貨
                <span id="selected-count" class="bg-white/30 text-white px-1.5 rounded-full text-[10px] leading-4 ml-0.5">0</span>
            </button>
        </div>
        <div id="pending-list" class="space-y-3">
            <div class="bg-white rounded-xl p-3 border border-slate-100 animate-pulse flex gap-3">
                <div class="w-16 h-16 bg-slate-100 rounded-lg flex-shrink-0"></div>
                <div class="flex-grow space-y-2 py-1">
                    <div class="h-3 bg-slate-100 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-100 rounded w-2/3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 已出貨 -->
    <div id="page-shipped" class="hidden">
        <div id="shipped-list" class="space-y-3"></div>
    </div>

    <!-- 補貨 -->
    <div id="page-restock" class="hidden">
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-4">
            <div class="bg-gradient-to-r from-amber-500 to-orange-400 px-4 py-3 flex items-center gap-2">
                <span class="material-icons text-white text-lg">inventory</span>
                <div>
                    <div class="text-white font-bold text-sm">補貨管理</div>
                    <div class="text-amber-100 text-[10px]">已售完商品庫存狀態</div>
                </div>
            </div>
            <div id="restock-body" class="divide-y divide-slate-100">
                <div class="text-center py-6 text-slate-400 text-xs">載入中...</div>
            </div>
        </div>
    </div>

</main>

<!-- 出貨確認彈窗 -->
<div id="ship-modal" class="fixed inset-0 z-50 hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;">
    <div onclick="closeModal()" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;" class="bg-white rounded-t-2xl p-5 max-w-md mx-auto shadow-2xl">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
        <div id="modal-preview" class="mb-4"></div>
        <button onclick="confirmShip()"
            class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
            <span class="material-icons">local_shipping</span>
            <span id="modal-btn-text">確認已出貨</span>
        </button>
        <button onclick="closeModal()" class="w-full mt-2 text-slate-500 text-sm py-2">取消</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw39xPwtYMRvOFI4lGgU0gaDuCHyzC4AfwTOqVkabNw_Z-0EVtRfYpndZ-ra7Tjv9iw/exec";

    let allOrders    = [];
    let currentTab   = 'picklist';
    let pendingGroup = null;
    let selectedRows = new Set();
    let isBulkShip   = false;

    // ── Lightbox ──
    function openLightbox(url) {
        const lb = document.getElementById('img-lightbox');
        document.getElementById('img-lightbox-src').src = url;
        lb.style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('img-lightbox').style.display = 'none';
        document.getElementById('img-lightbox-src').src = '';
    }

    // ── 拿貨表勾選（記憶體，重整清空）──
    const picklistChecked = new Set();
    function togglePicklistItem(idx) {
        if (picklistChecked.has(idx)) { picklistChecked.delete(idx); } else { picklistChecked.add(idx); }
        const checked = picklistChecked.has(idx);
        const nameEl  = document.getElementById('picklist-name-' + idx);
        const qtyEl   = document.getElementById('picklist-qty-' + idx);
        const qtyBox  = document.getElementById('picklist-qtybox-' + idx);
        nameEl.style.textDecoration = checked ? 'line-through' : 'none';
        nameEl.style.color          = checked ? '#94a3b8' : '';
        qtyEl.style.textDecoration  = checked ? 'line-through' : 'none';
        qtyEl.style.color           = checked ? '#94a3b8' : '';
        qtyBox.style.background     = checked ? '#f1f5f9' : '#fff7ed';
        qtyBox.style.borderColor    = checked ? '#e2e8f0' : '#fed7aa';
    }

    function getRestockStatus() {
        try { return JSON.parse(localStorage.getItem('restock_status') || '{}'); } catch(e) { return {}; }
    }
    function saveRestockStatus(map) { localStorage.setItem('restock_status', JSON.stringify(map)); }

    function hideLoading() {
        const ls = document.getElementById('loading-screen');
        if (ls) ls.style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', loadOrders);

    function loadOrders() {
        const ls = document.getElementById('loading-screen');
        if (ls) {
            ls.style.display = 'flex';
            document.getElementById('loading-msg').textContent = '正在載入訂單與圖片...';
            document.getElementById('loading-timeout-msg').style.display = 'none';
        }
        updateStatus("connecting", "正在同步訂單與圖片，請稍候...");
        const timeoutHint = setTimeout(function() {
            const ls = document.getElementById('loading-screen');
            if (ls && ls.style.display !== 'none') {
                document.getElementById('loading-timeout-msg').style.display = 'block';
                document.getElementById('loading-msg').textContent = '圖片載入中，請耐心等候...';
            }
        }, 8000);
        window._shopeeOrdersCb = function(data) {
            clearTimeout(timeoutHint);
            document.getElementById('jsonp-shopee')?.remove();
            hideLoading();
            if (data.error) { updateStatus("error", data.error); return; }
            allOrders = data;
            selectedRows.clear();
            renderAll();
            updateStatus("success", `已載入 ${data.length} 筆訂單資料`);
        };
        const s = document.createElement('script');
        s.id  = 'jsonp-shopee';
        s.src = `${API_URL}?action=shopee_orders&callback=_shopeeOrdersCb&_=${Date.now()}`;
        s.onerror = () => { clearTimeout(timeoutHint); hideLoading(); updateStatus("error", "連線失敗，請重試"); };
        document.body.appendChild(s);
    }

    function markShippedJSONP(row, unship) {
        return new Promise((resolve, reject) => {
            const cbName = '_shipCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
            window[cbName] = function(data) {
                document.getElementById('jsonp-ship-' + row)?.remove();
                delete window[cbName];
                if (data.status === 'success') resolve(data);
                else reject(new Error(data.message || 'failed'));
            };
            const s = document.createElement('script');
            s.id  = 'jsonp-ship-' + row;
            s.src = `${API_URL}?action=mark_shipped&row=${row}&unship=${unship}&callback=${cbName}&_=${Date.now()}`;
            s.onerror = () => { delete window[cbName]; reject(new Error('script load error')); };
            document.body.appendChild(s);
        });
    }

    // ── 拆解商品名稱與選項（以｜分隔）──
    function splitNameOption(fullName) {
        const idx = fullName.indexOf('｜');
        if (idx === -1) return { name: fullName, option: '' };
        return { name: fullName.substring(0, idx), option: fullName.substring(idx + 1) };
    }

    // ── 圖片 div（可點擊放大）──
    function imgDiv(url, size, clickable) {
        const sz = size + 'px';
        if (url && url.startsWith('data:')) {
            const clickStyle  = clickable ? 'cursor:zoom-in;' : '';
            const clickHandler = clickable ? `onclick="openLightbox('${url}')"` : '';
            return `<div style="width:${sz};height:${sz};flex-shrink:0;border-radius:8px;overflow:hidden;background:#f8fafc;${clickStyle}" ${clickHandler}>
                        <img src="${url}" style="width:100%;height:100%;object-fit:contain;" loading="lazy">
                    </div>`;
        }
        return `<div style="width:${sz};height:${sz};flex-shrink:0;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <span class="material-icons" style="color:#cbd5e1;font-size:24px;">image_not_supported</span>
                </div>`;
    }

    function renderAll() {
        const pending  = allOrders.filter(o => !o.shipped && o.orderId);
        const shipped  = allOrders.filter(o =>  o.shipped && o.orderId);
        const soldouts = allOrders.filter(o => !o.orderId);
        const bp = document.getElementById('badge-pending');
        const bs = document.getElementById('badge-shipped');
        const br = document.getElementById('badge-restock');
        bp.textContent = pending.length;  bp.classList.toggle('hidden', pending.length  === 0);
        bs.textContent = shipped.length;  bs.classList.toggle('hidden', shipped.length  === 0);
        br.textContent = soldouts.length; br.classList.toggle('hidden', soldouts.length === 0);
        renderPicklist(pending);
        renderPending(pending);
        renderShipped(shipped);
        renderRestock(soldouts);
    }

    // ── 拿貨表 ──
    function renderPicklist(orders) {
        const el = document.getElementById('picklist-body');
        const totalEl = document.getElementById('picklist-total');
        if (orders.length === 0) {
            totalEl.textContent = '0';
            el.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">目前無待出貨訂單</div>`;
            return;
        }
        const summary = new Map();
        orders.forEach(item => {
            // key = 完整名稱（含選項），相同商品+相同選項才合併
            const key = item.name;
            if (!summary.has(key)) summary.set(key, { name: item.name, imgUrl: item.imgUrl, totalQty: 0 });
            summary.get(key).totalQty += (parseInt(item.qty) || 0);
        });
        const sorted = Array.from(summary.values()).sort((a, b) => b.totalQty - a.totalQty);
        totalEl.textContent = sorted.length;
        el.innerHTML = sorted.map((s, idx) => {
            const done    = picklistChecked.has(idx);
            const { name: displayName, option: displayOption } = splitNameOption(s.name);
            const nameStyle = done ? 'text-decoration:line-through;color:#94a3b8;' : '';
            const qtyStyle  = done ? 'text-decoration:line-through;color:#94a3b8;' : '';
            const boxBg     = done ? 'background:#f1f5f9;border-color:#e2e8f0;' : 'background:#fff7ed;border-color:#fed7aa;';
            return `
            <div id="picklist-row-${idx}" class="flex items-start gap-3 px-3 py-3 border-b border-slate-50 last:border-0">
                <div class="w-6 h-6 rounded-full bg-orange-100 text-orange-500 text-[10px] font-bold flex items-center justify-center flex-shrink-0 mt-1">${idx + 1}</div>
                ${imgDiv(s.imgUrl, 76, true)}
                <div class="flex-grow min-w-0 py-0.5">
                    <div id="picklist-name-${idx}" style="${nameStyle}color:${done?'#94a3b8':'#334155'};word-break:break-word;font-size:14px;font-weight:500;line-height:1.4;">
                        ${displayName}
                        ${displayOption ? `<div style="font-size:12px;color:${done?'#94a3b8':'#f97316'};margin-top:3px;font-weight:600;">${displayOption}</div>` : ''}
                    </div>
                </div>
                <div id="picklist-qtybox-${idx}" onclick="togglePicklistItem(${idx})"
                    class="flex-shrink-0 text-center px-3 py-2 rounded-xl border-2 cursor-pointer active:scale-95 transition-all select-none mt-0.5"
                    style="${boxBg}min-width:52px;">
                    <div id="picklist-qty-${idx}" class="text-2xl font-bold leading-none" style="${qtyStyle}color:${done?'#94a3b8':'#f97316'}">${s.totalQty}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">${done ? '✓ 完成' : '件'}</div>
                </div>
            </div>`;
        }).join('');
    }

    // ── 未出貨 ──
    function renderPending(orders) {
        const el      = document.getElementById('pending-list');
        const toolbar = document.getElementById('select-toolbar');
        if (orders.length === 0) {
            toolbar.classList.add('hidden');
            el.innerHTML = `
                <div class="text-center py-10 bg-emerald-50/50 rounded-xl border border-dashed border-emerald-200">
                    <span class="material-icons text-emerald-400 text-4xl mb-2">celebration</span>
                    <div class="text-sm font-bold text-emerald-700">所有訂單皆已出貨！</div>
                </div>`;
            return;
        }
        toolbar.classList.remove('hidden');
        el.innerHTML = '';
        groupByOrder(orders).forEach(group => {
            const isChecked = group.rows.every(r => selectedRows.has(r));
            const rowsJson  = JSON.stringify(group.rows);
            const groupJson = JSON.stringify(group).replace(/"/g, '&quot;');
            const card = document.createElement('div');
            card.className = 'order-card bg-white rounded-xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden slide-in';
            card.innerHTML = `
                <div class="bg-slate-50 border-b border-slate-100 px-3 py-2 flex items-center gap-2">
                    <div class="checkbox-custom ${isChecked ? 'checked' : ''}" onclick="toggleOrderSelect(${rowsJson}, this)">
                        <span class="material-icons text-white text-sm ${isChecked ? '' : 'hidden'}">check</span>
                    </div>
                    <span class="material-icons text-orange-400 text-sm">receipt_long</span>
                    <span class="text-xs font-bold text-slate-700 flex-grow">${group.orderId}</span>
                    <span class="text-[10px] text-slate-400">${group.items[0]?.buyer || ''}</span>
                    <span class="text-[10px] text-slate-400 ml-1">${(group.items[0]?.date || '').substring(0,10)}</span>
                </div>
                ${group.items.map(item => {
                    const { name: dName, option: dOption } = splitNameOption(item.name);
                    return `
                    <div class="flex items-center gap-3 px-3 py-2.5 border-b border-slate-50 last:border-0">
                        ${imgDiv(item.imgUrl, 56, true)}
                        <div class="flex-grow min-w-0">
                            <div class="text-[13px] font-medium text-slate-800 leading-snug">${dName}</div>
                            ${dOption ? `<div class="text-[12px] font-semibold text-orange-500 mt-0.5">${dOption}</div>` : ''}
                        </div>
                        <div class="flex-shrink-0 text-center px-3 py-2 rounded-xl border-2 ml-1" style="background:#fff7ed;border-color:#fed7aa;min-width:52px;">
                            <div class="text-2xl font-bold leading-none text-orange-500">${item.qty}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">件</div>
                        </div>
                    </div>`
                }).join('')}
                <div class="px-3 py-2 bg-slate-50/50">
                    <button onclick='openShipModal(${groupJson})'
                        class="w-full bg-orange-500 text-white text-sm font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                        <span class="material-icons text-base">local_shipping</span>標記已出貨
                    </button>
                </div>`;
            el.appendChild(card);
        });
        updateSelectUI();
    }

    // ── 已出貨 ──
    function renderShipped(orders) {
        const el = document.getElementById('shipped-list');
        if (orders.length === 0) {
            el.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">尚無已出貨訂單</div>`;
            return;
        }
        el.innerHTML = '';
        groupByOrder(orders).forEach(group => {
            const card = document.createElement('div');
            card.className = 'order-card bg-white rounded-xl border border-emerald-100 overflow-hidden slide-in opacity-80';
            card.innerHTML = `
                <div class="bg-emerald-50 border-b border-emerald-100 px-3 py-2 flex items-center justify-between">
                    <div class="flex items-center gap-1.5">
                        <span class="material-icons text-emerald-500 text-sm">check_circle</span>
                        <span class="text-xs font-bold text-slate-700">${group.orderId}</span>
                        <span class="text-[10px] text-slate-400">${group.items[0]?.buyer || ''}</span>
                    </div>
                    <div class="text-[10px] text-emerald-600 font-medium">出貨 ${(group.items[0]?.shippedAt || '').substring(0,10)}</div>
                </div>
                ${group.items.map(item => {
                    const { name: dName, option: dOption } = splitNameOption(item.name);
                    return `
                    <div class="flex items-center gap-3 px-3 py-2.5 border-b border-slate-50 last:border-0">
                        <div class="flex-grow min-w-0">
                            <div class="text-[12px] text-slate-500">${dName}</div>
                            ${dOption ? `<div class="text-[11px] font-semibold text-orange-400 mt-0.5">${dOption}</div>` : ''}
                            <div class="text-xs text-slate-400">數量：<span class="font-medium text-slate-600">${item.qty}</span></div>
                        </div>
                    </div>`;
                }).join('')}
                <div class="px-3 py-2">
                    <button onclick="unship(${JSON.stringify(group.rows)})"
                        class="w-full border border-slate-200 text-slate-500 text-xs font-medium py-1.5 rounded-lg flex items-center justify-center gap-1 active:scale-95 transition-all">
                        <span class="material-icons text-sm">undo</span>撤銷出貨
                    </button>
                </div>`;
            el.appendChild(card);
        });
    }

    // ── 補貨管理 ──
    function renderRestock(soldouts) {
        const el     = document.getElementById('restock-body');
        const status = getRestockStatus();
        if (soldouts.length === 0) {
            el.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">目前無已售完商品通知</div>`;
            return;
        }
        el.innerHTML = soldouts.map((item) => {
            const { name: dName, option: dOption } = splitNameOption(item.name);
            const key = item.name + '_' + item.row;
            const cur = status[key] || 'pending';
            return `
            <div class="flex items-center gap-3 px-3 py-3">
                ${imgDiv(item.imgUrl, 56, true)}
                <div class="flex-grow min-w-0">
                    <div class="text-[13px] font-medium text-slate-700 leading-snug">${dName}</div>
                    ${dOption ? `<div class="text-[12px] font-semibold text-orange-500 mt-0.5">${dOption}</div>` : ''}
                    <div class="text-[10px] text-slate-400 mt-0.5">${item.date || ''}</div>
                </div>
                <div class="flex flex-col gap-1 flex-shrink-0">
                    <button onclick="setRestock('${key}', 'restocked')"
                        class="text-[11px] px-2.5 py-1 rounded-lg font-bold border flex items-center gap-0.5 active:scale-95 ${cur === 'restocked' ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-slate-500 border-slate-200'}">
                        <span class="material-icons text-xs">check_circle</span>已補貨
                    </button>
                    <button onclick="setRestock('${key}', 'shortage')"
                        class="text-[11px] px-2.5 py-1 rounded-lg font-bold border flex items-center gap-0.5 active:scale-95 ${cur === 'shortage' ? 'bg-red-500 text-white border-red-500' : 'bg-white text-slate-500 border-slate-200'}">
                        <span class="material-icons text-xs">remove_circle</span>缺貨
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function setRestock(key, newStatus) {
        const map = getRestockStatus();
        map[key]  = map[key] === newStatus ? 'pending' : newStatus;
        saveRestockStatus(map);
        renderRestock(allOrders.filter(o => !o.orderId));
    }

    function toggleOrderSelect(rows, boxEl) {
        const allChecked = rows.every(r => selectedRows.has(r));
        rows.forEach(r => allChecked ? selectedRows.delete(r) : selectedRows.add(r));
        const isNow = rows.every(r => selectedRows.has(r));
        boxEl.classList.toggle('checked', isNow);
        const chk = boxEl.querySelector('.material-icons');
        if (chk) chk.classList.toggle('hidden', !isNow);
        updateSelectUI();
    }

    function toggleSelectAll() {
        const pending = allOrders.filter(o => !o.shipped && o.orderId);
        const allRows = pending.map(o => o.row);
        const allSel  = allRows.every(r => selectedRows.has(r));
        allRows.forEach(r => allSel ? selectedRows.delete(r) : selectedRows.add(r));
        renderPending(pending);
    }

    function updateSelectUI() {
        const pending    = allOrders.filter(o => !o.shipped && o.orderId);
        const allRows    = pending.map(o => o.row);
        const allChecked = allRows.length > 0 && allRows.every(r => selectedRows.has(r));
        const count      = selectedRows.size;
        const box   = document.getElementById('select-all-box');
        const chk   = document.getElementById('select-all-check');
        const btn   = document.getElementById('btn-ship-selected');
        const cntEl = document.getElementById('selected-count');
        if (box)   box.classList.toggle('checked', allChecked);
        if (chk)   chk.classList.toggle('hidden', !allChecked);
        if (btn)   { btn.disabled = count === 0; btn.classList.toggle('opacity-40', count === 0); }
        if (cntEl) cntEl.textContent = count;
    }

    function openShipModal(group) {
        isBulkShip   = false;
        pendingGroup = group;
        document.getElementById('modal-btn-text').textContent = '確認已出貨';
        document.getElementById('modal-preview').innerHTML = group.items.map(item => {
            const { name: dName, option: dOption } = splitNameOption(item.name);
            return `
            <div class="flex gap-3 items-center mb-2">
                ${imgDiv(item.imgUrl, 48, false)}
                <div class="min-w-0">
                    <div class="text-xs font-bold text-orange-600">${group.orderId}</div>
                    <div class="text-sm font-bold text-slate-800 line-clamp-1">${dName}</div>
                    ${dOption ? `<div class="text-xs font-semibold text-orange-500">${dOption}</div>` : ''}
                    <div class="text-xs text-slate-400">數量：${item.qty}</div>
                </div>
            </div>`;
        }).join('');
        document.getElementById('ship-modal').classList.remove('hidden');
    }

    function shipSelected() {
        if (selectedRows.size === 0) return;
        isBulkShip   = true;
        pendingGroup = null;
        const count  = selectedRows.size;
        document.getElementById('modal-btn-text').textContent = `確認出貨 ${count} 筆訂單`;
        document.getElementById('modal-preview').innerHTML = `
            <div class="flex items-center gap-3 mb-2">
                <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
                    <span class="material-icons text-orange-500 text-2xl">local_shipping</span>
                </div>
                <div>
                    <div class="text-sm font-bold text-slate-800">批次出貨</div>
                    <div class="text-xs text-slate-500">共 ${count} 筆訂單將標記為已出貨</div>
                </div>
            </div>`;
        document.getElementById('ship-modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('ship-modal').classList.add('hidden'); }

    async function confirmShip() {
        closeModal();
        const rows = isBulkShip ? Array.from(selectedRows) : (pendingGroup?.rows || []);
        if (rows.length === 0) return;
        updateStatus("uploading", `正在標記 ${rows.length} 筆出貨...`);
        try {
            for (const row of rows) await markShippedJSONP(row, false);
            selectedRows.clear();
            updateStatus("success", `已成功標記 ${rows.length} 筆出貨！`);
            loadOrders();
        } catch(e) { updateStatus("error", "標記失敗，請重試"); }
    }

    async function unship(rows) {
        updateStatus("uploading", "正在撤銷出貨狀態...");
        try {
            for (const row of rows) await markShippedJSONP(row, true);
            updateStatus("success", "已撤銷出貨");
            loadOrders();
        } catch(e) { updateStatus("error", "撤銷失敗，請重試"); }
    }

    function groupByOrder(orders) {
        const map = new Map();
        orders.forEach(item => {
            if (!map.has(item.orderId)) map.set(item.orderId, { orderId: item.orderId, rows: [], items: [] });
            const g = map.get(item.orderId);
            g.rows.push(item.row);
            g.items.push(item);
        });
        return Array.from(map.values()).sort((a, b) =>
            (b.items[0]?.date || '').localeCompare(a.items[0]?.date || ''));
    }

    function switchTab(tab) {
        currentTab = tab;
        ['picklist','pending','shipped','restock'].forEach(t => {
            document.getElementById(`page-${t}`).classList.toggle('hidden', t !== tab);
            const btn = document.getElementById(`tab-${t}`);
            if (btn) { btn.classList.toggle('tab-active', t === tab); btn.classList.toggle('text-slate-500', t !== tab); }
        });
    }

    function updateStatus(type, text) {
        const bar = document.getElementById('status-bar');
        bar.className = "text-[11px] py-1 px-4 text-center font-medium flex items-center justify-center gap-1.5 transition-all border-t ";
        if (type === "connecting" || type === "uploading") {
            bar.classList.add("bg-amber-50","border-amber-100","text-amber-700");
            bar.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span><span>${text}</span>`;
        } else if (type === "success") {
            bar.classList.add("bg-emerald-50","border-emerald-100","text-emerald-700");
            bar.innerHTML = `<span class="material-icons text-xs text-emerald-500">check_circle</span><span>${text}</span>`;
            setTimeout(() => { bar.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>系統就緒</span>`; }, 3000);
        } else if (type === "error") {
            bar.classList.add("bg-rose-50","border-rose-100","text-rose-700");
            bar.innerHTML = `<span class="material-icons text-xs text-rose-500">error</span><span class="font-bold">${text}</span>`;
        }
    }
</script>
</body>
</html>
