<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錦輝塑膠 - 蝦皮訂單管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .blur-bg { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .tab-active { 
            background: white; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); 
            color: #2563eb;
            font-weight: 700;
        }
        .order-card { transition: all 0.25s cubic-bezier(.4,0,.2,1); }
        .order-card:active { transform: scale(0.985); }
        .slide-in { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-24">

    <!-- 頂部導覽列 -->
    <header class="bg-white/80 blur-bg border-b border-slate-200/80 sticky top-0 z-50 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <!-- 返回盤點系統 -->
                <a href="./index.html" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-95 transition-all mr-1">
                    <span class="material-icons text-xl">arrow_back</span>
                </a>
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-sm shadow-md shadow-orange-200">
                    <span class="material-icons text-base">storefront</span>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-900 tracking-wide">蝦皮訂單管理</h1>
                    <p class="text-[10px] text-slate-500 font-medium tracking-wider uppercase">Shopee Orders</p>
                </div>
            </div>
            <button onclick="loadOrders()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-95 transition-all">
                <span class="material-icons text-xl">refresh</span>
            </button>
        </div>

        <!-- 連線狀態條 -->
        <div id="status-bar" class="bg-amber-50 border-t border-amber-100 text-[11px] text-amber-700 py-1 px-4 text-center font-medium flex items-center justify-center gap-1.5 transition-all">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="status-text">正在載入訂單資料...</span>
        </div>

        <!-- 分頁 Tab -->
        <div class="bg-slate-100/80 mx-4 my-2 rounded-xl p-1 flex gap-1">
            <button onclick="switchTab('pending')" id="tab-pending"
                class="tab-active flex-1 py-1.5 rounded-lg text-xs transition-all flex items-center justify-center gap-1">
                <span class="material-icons text-sm">local_shipping</span>
                <span>未出貨</span>
                <span id="badge-pending" class="bg-red-500 text-white text-[10px] px-1.5 rounded-full leading-4 hidden">0</span>
            </button>
            <button onclick="switchTab('shipped')" id="tab-shipped"
                class="flex-1 py-1.5 rounded-lg text-xs text-slate-500 transition-all flex items-center justify-center gap-1">
                <span class="material-icons text-sm">check_circle</span>
                <span>已出貨</span>
                <span id="badge-shipped" class="bg-emerald-500 text-white text-[10px] px-1.5 rounded-full leading-4 hidden">0</span>
            </button>
            <button onclick="switchTab('picklist')" id="tab-picklist"
                class="flex-1 py-1.5 rounded-lg text-xs text-slate-500 transition-all flex items-center justify-center gap-1">
                <span class="material-icons text-sm">list_alt</span>
                <span>拿貨表</span>
            </button>
        </div>
    </header>

    <!-- 主內容 -->
    <main class="max-w-md mx-auto px-4 mt-3">

        <!-- ══ 未出貨頁 ══ -->
        <div id="page-pending">
            <div id="pending-list" class="space-y-3">
                <!-- 骨架屏 -->
                <div class="bg-white rounded-xl p-3 border border-slate-100 animate-pulse flex gap-3">
                    <div class="w-16 h-16 bg-slate-100 rounded-lg flex-shrink-0"></div>
                    <div class="flex-grow space-y-2 py-1">
                        <div class="h-3 bg-slate-100 rounded w-1/3"></div>
                        <div class="h-4 bg-slate-100 rounded w-2/3"></div>
                        <div class="h-3 bg-slate-100 rounded w-1/4"></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-3 border border-slate-100 animate-pulse flex gap-3">
                    <div class="w-16 h-16 bg-slate-100 rounded-lg flex-shrink-0"></div>
                    <div class="flex-grow space-y-2 py-1">
                        <div class="h-3 bg-slate-100 rounded w-1/4"></div>
                        <div class="h-4 bg-slate-100 rounded w-3/4"></div>
                        <div class="h-3 bg-slate-100 rounded w-1/3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ══ 已出貨頁 ══ -->
        <div id="page-shipped" class="hidden">
            <div id="shipped-list" class="space-y-3"></div>
        </div>

        <!-- ══ 拿貨表 ══ -->
        <div id="page-picklist" class="hidden">
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-4">
                <div class="bg-gradient-to-r from-orange-500 to-amber-500 px-4 py-3 flex items-center gap-2">
                    <span class="material-icons text-white text-lg">inventory_2</span>
                    <div>
                        <div class="text-white font-bold text-sm">拿貨清單</div>
                        <div class="text-orange-100 text-[10px]">統計所有未出貨訂單商品</div>
                    </div>
                </div>
                <div id="picklist-body" class="divide-y divide-slate-100">
                    <div class="text-center py-6 text-slate-400 text-xs">載入中...</div>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部出貨確認彈窗 -->
    <div id="ship-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-5 max-w-md mx-auto shadow-2xl">
            <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
            <div class="flex gap-3 mb-4">
                <img id="modal-img" src="" class="w-16 h-16 rounded-xl object-cover border border-slate-100 bg-slate-50">
                <div class="flex-grow min-w-0">
                    <div id="modal-order" class="text-xs text-orange-600 font-bold mb-0.5"></div>
                    <div id="modal-name" class="text-sm font-bold text-slate-800 leading-snug"></div>
                    <div id="modal-qty" class="text-xs text-slate-500 mt-1"></div>
                </div>
            </div>
            <button onclick="confirmShip()" 
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg shadow-orange-200">
                <span class="material-icons">local_shipping</span>
                確認已出貨
            </button>
            <button onclick="closeModal()" class="w-full mt-2 text-slate-500 text-sm py-2">取消</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw39xPwtYMRvOFI4lGgU0gaDuCHyzC4AfwTOqVkabNw_Z-0EVtRfYpndZ-ra7Tjv9iw/exec";

        let allOrders = [];
        let currentTab = 'pending';
        let pendingShipRow = null;

        window.addEventListener('DOMContentLoaded', loadOrders);

        // ── 載入訂單 ──
        function loadOrders() {
            updateStatus("connecting", "正在同步蝦皮訂單資料...");
            window._shopeeOrdersCb = function(data) {
                document.getElementById('jsonp-shopee')?.remove();
                if (data.error) { updateStatus("error", data.error); return; }
                allOrders = data;
                renderAll();
                updateStatus("success", `已載入 ${data.length} 筆訂單資料`);
            };
            const s = document.createElement('script');
            s.id = 'jsonp-shopee';
            s.src = `${API_URL}?action=shopee_orders&callback=_shopeeOrdersCb&_=${Date.now()}`;
            s.onerror = () => updateStatus("error", "連線失敗，請重試");
            document.body.appendChild(s);
        }

        // ── 渲染所有分頁 ──
        function renderAll() {
            const pending = allOrders.filter(o => !o.shipped && o.orderId);
            const shipped = allOrders.filter(o => o.shipped && o.orderId);

            // 更新 badge
            const bp = document.getElementById('badge-pending');
            const bs = document.getElementById('badge-shipped');
            bp.textContent = pending.length;
            bs.textContent = shipped.length;
            bp.classList.toggle('hidden', pending.length === 0);
            bs.classList.toggle('hidden', shipped.length === 0);

            renderPending(pending);
            renderShipped(shipped);
            renderPicklist(pending);
        }

        // ── 未出貨列表 ──
        function renderPending(orders) {
            const el = document.getElementById('pending-list');

            if (orders.length === 0) {
                el.innerHTML = `
                    <div class="text-center py-10 bg-emerald-50/50 rounded-xl border border-dashed border-emerald-200">
                        <span class="material-icons text-emerald-400 text-4xl mb-2">celebration</span>
                        <div class="text-sm font-bold text-emerald-700">所有訂單皆已出貨！</div>
                        <div class="text-xs text-emerald-500 mt-1">太厲害了</div>
                    </div>`;
                return;
            }

            // 依訂單編號分組
            const grouped = groupByOrder(orders);
            el.innerHTML = '';

            grouped.forEach(group => {
                const card = document.createElement('div');
                card.className = 'order-card bg-white rounded-xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden slide-in';
                
                // 訂單標頭
                const headerHtml = `
                    <div class="bg-slate-50 border-b border-slate-100 px-3 py-2 flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <span class="material-icons text-orange-400 text-sm">receipt_long</span>
                            <span class="text-xs font-bold text-slate-700">${group.orderId}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400">${group.items[0]?.buyer || ''}</span>
                            <span class="text-[10px] text-slate-400">${group.items[0]?.date || ''}</span>
                        </div>
                    </div>`;

                // 商品列表
                const itemsHtml = group.items.map(item => `
                    <div class="flex items-center gap-3 px-3 py-2.5 border-b border-slate-50 last:border-0">
                        <div class="w-14 h-14 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">
                            <img src="${item.imgUrl || 'https://placehold.co/100x100/f1f5f9/94a3b8?text=?'}"
                                 class="w-full h-full object-cover"
                                 onerror="this.src='https://placehold.co/100x100/fef2f2/ef4444?text=Err'">
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="text-[13px] font-medium text-slate-800 leading-snug line-clamp-2">${item.name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">數量：<span class="font-bold text-slate-700 text-sm">${item.qty}</span></div>
                        </div>
                    </div>`).join('');

                // 出貨按鈕（整張訂單一起出）
                const footerHtml = `
                    <div class="px-3 py-2 bg-slate-50/50">
                        <button onclick="openShipModal(${JSON.stringify(group).replace(/"/g, '&quot;')})"
                            class="w-full bg-orange-500 text-white text-sm font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition-all shadow-sm shadow-orange-100">
                            <span class="material-icons text-base">local_shipping</span>
                            標記已出貨
                        </button>
                    </div>`;

                card.innerHTML = headerHtml + itemsHtml + footerHtml;
                el.appendChild(card);
            });
        }

        // ── 已出貨列表 ──
        function renderShipped(orders) {
            const el = document.getElementById('shipped-list');
            if (orders.length === 0) {
                el.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">尚無已出貨訂單</div>`;
                return;
            }
            const grouped = groupByOrder(orders);
            el.innerHTML = '';
            grouped.forEach(group => {
                const card = document.createElement('div');
                card.className = 'order-card bg-white rounded-xl border border-emerald-100 shadow-[0_2px_8px_rgba(0,0,0,0.02)] overflow-hidden slide-in opacity-80';
                const headerHtml = `
                    <div class="bg-emerald-50 border-b border-emerald-100 px-3 py-2 flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <span class="material-icons text-emerald-500 text-sm">check_circle</span>
                            <span class="text-xs font-bold text-slate-700">${group.orderId}</span>
                        </div>
                        <div class="text-[10px] text-emerald-600 font-medium">
                            出貨 ${group.items[0]?.shippedAt || ''}
                        </div>
                    </div>`;
                const itemsHtml = group.items.map(item => `
                    <div class="flex items-center gap-3 px-3 py-2.5 border-b border-slate-50 last:border-0">
                        <div class="w-12 h-12 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0 opacity-70">
                            <img src="${item.imgUrl || 'https://placehold.co/100x100/f1f5f9/94a3b8?text=?'}"
                                 class="w-full h-full object-cover"
                                 onerror="this.src='https://placehold.co/100x100/fef2f2/ef4444?text=Err'">
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="text-[12px] text-slate-500 leading-snug line-clamp-2">${item.name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">數量：<span class="font-medium text-slate-600">${item.qty}</span></div>
                        </div>
                    </div>`).join('');
                // 撤銷按鈕
                const footerHtml = `
                    <div class="px-3 py-2">
                        <button onclick="unship(${group.rows.join(',')})"
                            class="w-full border border-slate-200 text-slate-500 text-xs font-medium py-1.5 rounded-lg flex items-center justify-center gap-1 active:scale-95 transition-all">
                            <span class="material-icons text-sm">undo</span>
                            撤銷出貨
                        </button>
                    </div>`;
                card.innerHTML = headerHtml + itemsHtml + footerHtml;
                el.appendChild(card);
            });
        }

        // ── 拿貨表 ──
        function renderPicklist(pendingOrders) {
            const el = document.getElementById('picklist-body');
            if (pendingOrders.length === 0) {
                el.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">目前無待出貨訂單</div>`;
                return;
            }
            // 彙總相同商品名稱
            const summary = new Map();
            pendingOrders.forEach(item => {
                const key = item.name;
                if (!summary.has(key)) {
                    summary.set(key, { name: item.name, imgUrl: item.imgUrl, totalQty: 0 });
                }
                summary.get(key).totalQty += (parseInt(item.qty) || 0);
            });
            // 依數量排序
            const sorted = Array.from(summary.values()).sort((a, b) => b.totalQty - a.totalQty);
            el.innerHTML = sorted.map((s, idx) => `
                <div class="flex items-center gap-3 px-3 py-2.5">
                    <div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 text-xs font-bold flex items-center justify-center flex-shrink-0">
                        ${idx + 1}
                    </div>
                    <div class="w-12 h-12 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">
                        <img src="${s.imgUrl || 'https://placehold.co/100x100/f1f5f9/94a3b8?text=?'}"
                             class="w-full h-full object-cover"
                             onerror="this.src='https://placehold.co/100x100/fef2f2/ef4444?text=Err'">
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="text-[13px] font-medium text-slate-700 leading-snug line-clamp-2">${s.name}</div>
                    </div>
                    <div class="flex-shrink-0 text-right">
                        <div class="text-xl font-bold text-orange-500">${s.totalQty}</div>
                        <div class="text-[10px] text-slate-400">件</div>
                    </div>
                </div>`).join('');
        }

        // ── 出貨確認彈窗 ──
        let pendingGroup = null;
        function openShipModal(group) {
            pendingGroup = group;
            const first = group.items[0];
            document.getElementById('modal-img').src   = first.imgUrl || 'https://placehold.co/100x100/f1f5f9/94a3b8?text=?';
            document.getElementById('modal-order').textContent = group.orderId;
            document.getElementById('modal-name').textContent  = group.items.length > 1
                ? `共 ${group.items.length} 件商品` : first.name;
            document.getElementById('modal-qty').textContent   = group.items.length > 1
                ? group.items.map(i => `${i.name} ×${i.qty}`).join('、') : `數量：${first.qty}`;
            document.getElementById('ship-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('ship-modal').classList.add('hidden');
            pendingGroup = null;
        }

        // ── 確認出貨（對每一列都寫入時間）──
        async function confirmShip() {
            if (!pendingGroup) return;
            closeModal();
            updateStatus("uploading", "正在更新出貨狀態...");
            try {
                for (const row of pendingGroup.rows) {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "mark_shipped", row: row, unship: false })
                    });
                }
                updateStatus("success", `訂單 ${pendingGroup.orderId} 已標記出貨`);
                loadOrders();
            } catch(e) {
                updateStatus("error", "更新失敗，請重試");
            }
        }

        // ── 撤銷出貨 ──
        async function unship(...rows) {
            updateStatus("uploading", "正在撤銷出貨狀態...");
            try {
                for (const row of rows) {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "mark_shipped", row: row, unship: true })
                    });
                }
                updateStatus("success", "已撤銷出貨");
                loadOrders();
            } catch(e) {
                updateStatus("error", "撤銷失敗，請重試");
            }
        }

        // ── 依訂單編號分組 ──
        function groupByOrder(orders) {
            const map = new Map();
            orders.forEach(item => {
                if (!map.has(item.orderId)) {
                    map.set(item.orderId, { orderId: item.orderId, rows: [], items: [] });
                }
                const g = map.get(item.orderId);
                g.rows.push(item.row);
                g.items.push(item);
            });
            // 最新訂單在最上面（依日期倒序）
            return Array.from(map.values()).sort((a, b) => {
                const da = a.items[0]?.date || '';
                const db = b.items[0]?.date || '';
                return db.localeCompare(da);
            });
        }

        // ── Tab 切換 ──
        function switchTab(tab) {
            currentTab = tab;
            ['pending','shipped','picklist'].forEach(t => {
                document.getElementById(`page-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.classList.toggle('tab-active', t === tab);
                if (btn) btn.classList.toggle('text-slate-500', t !== tab);
            });
        }

        // ── 狀態列 ──
        function updateStatus(type, text) {
            const bar = document.getElementById('status-bar');
            bar.className = "text-[11px] py-1 px-4 text-center font-medium flex items-center justify-center gap-1.5 transition-all border-t ";
            if (type === "connecting" || type === "uploading") {
                bar.classList.add("bg-amber-50","border-amber-100","text-amber-700");
                bar.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span><span>${text}</span>`;
            } else if (type === "success") {
                bar.classList.add("bg-emerald-50","border-emerald-100","text-emerald-700");
                bar.innerHTML = `<span class="material-icons text-xs text-emerald-500">check_circle</span><span>${text}</span>`;
                setTimeout(() => {
                    bar.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>系統就緒 · 連線正常</span>`;
                }, 3000);
            } else if (type === "error") {
                bar.classList.add("bg-rose-50","border-rose-100","text-rose-700");
                bar.innerHTML = `<span class="material-icons text-xs text-rose-500">error</span><span class="font-bold">${text}</span>`;
            }
        }
    </script>
</body>
</html>
